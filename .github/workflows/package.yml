name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # release

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tylko pakowanie plików z gita (bez bin/obj i appsettings.json z .gitignore), bez kompilacji
      - run: git archive --format=zip --prefix=PipelineClip/ -o PipelineClip.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PipelineClip-source
          path: PipelineClip.zip
      # release tylko po wypchnięciu tagu v*
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PipelineClip.zip --title "$GITHUB_REF_NAME" --generate-notes
