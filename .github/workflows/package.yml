name: package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tylko pakowanie plików z gita (bez bin/obj i appsettings.json z .gitignore), bez kompilacji
      - run: git archive --format=zip --prefix=PipelineClip/ -o PipelineClip.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PipelineClip-source
          path: PipelineClip.zip
